services:
  - type: web
    name: edgediffusion-mobile-ai
    env: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python run.py --device cpu
    envVars:
      - key: DEVICE
        value: cpu
      - key: PYTHON_VERSION
        value: 3.11.9
